# SPDX-License-Identifier: GPL-2.0
[package]
name = "kconfirm"
repository = "https://github.com/julianbraha/kconfirm"
license-file = "LICENSE"
description = "A static analysis tool for Kconfig"
keywords = ["kconfig", "static", "analysis", "detect"]
categories = ["development-tools", "config", "command-line-utilities"]
exclude = ["assets/", "findings/"]
version = "0.9.0"
edition = "2024"

[workspace]
members = ["kconfirm-lib", "kconfirm-cli", "kconfirm-linux", "kconfirm-desugar"]
resolver = "3"

[workspace.package]
rust-version = "1.85.0"

[workspace.dependencies]
nom-kconfig = { git = "https://github.com/Mcdostone/nom-kconfig.git", branch = "fix/depends-on_with_compare", default-features = false, features = [
    "display",
    "kconfiglib",
] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
