# SPDX-License-Identifier: GPL-2.0
[package]
name = "kconfirm-lib"
version = "0.9.1"
edition = "2024"
rust-version.workspace = true
description = "Static analysis library for the Kconfig configuration language"
license = "GPL-2.0-only"
repository = "https://github.com/julianbraha/kconfirm"
readme = "README.md"
keywords = ["kconfig", "static-analysis", "linux", "linter"]
categories = ["development-tools", "config"]

[dependencies]
nom-kconfig = { workspace = true }
curl = { version = "0.4" }
log = { workspace = true }
env_logger = { workspace = true }
# `std` gives the `Error` impl and the runtime CPU-feature detection,
# `unicode-perl` gives the `\s` class that the link pattern uses.
# NOTE: nom-kconfig 0.10 pulled these features in for us, 0.12 does not depend on regex.
regex = { version = "1.12", default-features = false, features = [
    "std",
    "unicode-perl",
] }

[features]
default = []
coreboot = ["nom-kconfig/glob-wildcard"]
